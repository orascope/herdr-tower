[package]
name = "tower_usage"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "Context usage and model reporting"
license = "Apache-2.0"

[dependencies]
tower_os.workspace = true
tower_state.workspace = true
serde = { workspace = true }
serde_json = { workspace = true }
time = { workspace = true, features = ["serde-well-known", "parsing"] }

[dev-dependencies]
tower_testrng.workspace = true
tempfile = { workspace = true }
