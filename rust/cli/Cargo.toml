[package]
name = "tower_cli"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "Control tower command line"
license = "Apache-2.0"

[[bin]]
name = "herdr-tower"
path = "src/main.rs"

[dependencies]
tower_os.workspace = true
tower_config.workspace = true
tower_discord.workspace = true
tower_hook.workspace = true
tower_mux.workspace = true
tower_notify.workspace = true
tower_scan.workspace = true
tower_state.workspace = true
tower_text.workspace = true
tower_ui.workspace = true
tower_usage.workspace = true
tower_wiring.workspace = true
tower_wt.workspace = true
herdrx.workspace = true
libc = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
time = { workspace = true, features = ["formatting", "local-offset", "parsing"] }
unicode-width = { workspace = true }
ureq = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }

[dev-dependencies]
tower_testrng.workspace = true
serde_json = { workspace = true }
tempfile = { workspace = true }
time = { workspace = true, features = ["macros"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true }
