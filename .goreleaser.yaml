# goreleaser configuration — unused while GitHub Actions is off; releases are
# built by scripts/release.sh. `goreleaser release` would publish as far as the
# brew cask, through orascope/homebrew-tap.
version: 2

# The version comes from the git tag. A build with no tag leaves the version
# empty and `build.rs` reports `dev`.

# goreleaser does not build. `.github/workflows/release.yml` builds each target on
# its **own native runner** and hands the artifacts over; this only packages them.
#
# Why nothing is cross-compiled: `ring` — the TLS the HTTP client reaches through
# rustls — carries assembly, so building Linux from macOS needs a C cross
# toolchain. goreleaser's Rust builder answers that with `zig cc`, which works but
# adds a toolchain to install and to keep working. A native runner per target
# needs nothing, and GitHub has one for all four.
#
# The version is stamped through environment variables rather than ldflags, which
# Rust has no equivalent of. `rust/cli/build.rs` reads three of them and consults
# git only for what they leave empty — so a release build never touches git, and
# two builds of the same tag agree.
builds:
  - id: herdr-tower
    builder: prebuilt
    binary: herdr-tower
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    ignore:
      - goos: darwin
        goarch: amd64
    prebuilt:
      # The workflow lays them out under goreleaser's own os/arch names rather
      # than the Rust target triples, so this template needs no mapping table.
      path: prebuilt/{{ .Os }}_{{ .Arch }}/herdr-tower

archives:
  - id: default
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    # Apache-2.0 §4(d): NOTICE travels with every redistribution, and the
    # default file set (LICENSE*, README*, CHANGELOG*) leaves it out.
    files: [LICENSE, NOTICE, README.md]

# `brews` is fully deprecated as of v2.16 and goes in the next major, so this uses
# a cask. The cask is created under the tap's Casks/. On the first cask release,
# delete the tap's Formula/herdr-tower.rb by hand.
# A semver pre-release tag — rc, beta — is marked as a prerelease on GitHub and
# leaves the brew cask alone. (Neither happened for v1.4.0-rc1 and it was undone
# by hand, 2026-09-07.)
release:
  prerelease: auto

homebrew_casks:
  - name: herdr-tower
    skip_upload: auto
    repository:
      owner: orascope
      name: homebrew-tap
    homepage: https://github.com/orascope/herdr-tower
    description: "The multi-agent control tower for herdr — state, notifications, worktrees"
    license: Apache-2.0
    # conflicts.formula is a no-op Homebrew removed (deprecated in goreleaser
    # v2.12) — anyone who installed the old formula is told to uninstall it by hand.
    # The binary is unsigned, so a hook is needed to clear the Gatekeeper
    # quarantine (signing and notarising need a paid developer account).
    hooks:
      post:
        install: |
          if system_command("/usr/bin/xattr", args: ["-h"]).exit_status == 0
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/herdr-tower"]
          end

checksum:
  name_template: "checksums.txt"
